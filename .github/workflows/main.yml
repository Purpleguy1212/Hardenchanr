name: Build HardEnchant

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: HardEnchant-jar
          path: target/HardEnchant.jar
        
